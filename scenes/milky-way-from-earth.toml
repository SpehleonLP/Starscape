# A Milky-Way-like galaxy seen from a Sun-like position: 8.2 kpc out, 20 pc above the plane,
# with Earth's spin axis (celestial north) tilted ~62.6° from the galactic pole.
[output]
face_size    = 256
target_stars = 4000
quality      = "final"
preview      = { width = 8192, march = false }

[observer]
position      = [8200.0, 0.0, 20.0]
spin_axis     = [0.4838, -0.7471, 0.4560]
zero_meridian = [0.0549, -0.4940, -0.8677]

[[galaxy]]
preset = "milky-way"
seed   = 1

  # The Local Bubble: the Sun sits in a dust-poor cavity a few hundred parsecs across that opens
  # toward the galactic poles, which is why the high latitudes are clear.
  [galaxy.dust]
  bubble = { center = [8200.0, 0.0, 20.0], radius = 300.0, height = 800.0 }

[[galaxy]]
preset   = "small-spiral"
position = [780000.0, 120000.0, -40000.0]
rotation = [77.0, 0.0, 35.0]
seed     = 2
