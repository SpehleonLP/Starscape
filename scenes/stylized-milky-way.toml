# The Earth scene pushed toward a fantastical look that keeps the galaxy's structure: darker, more
# filamentary dust, bolder arms, young-star gas glowing red with teal cores, and more vivid star colour.
# The nebula layer (palette, large-scale gas, bubble rim, dust reflection) follows
# docs/images/2026-10-15-nebula-target.png.
# Target: docs/images/2026-10-13-stylized-target.png. Galactic frame, as in milky-way-from-earth.toml.
[output]
face_size    = 256
target_stars = 4000
quality      = "final"
preview      = { width = 8192 }

[observer]
position      = [8200.0, 0.0, 20.0]
spin_axis     = [0.0, 0.0, 1.0]
zero_meridian = [-1.0, 0.0, 0.0]

[style]
star_saturation = 1.5

[[galaxy]]
preset = "milky-way"
seed   = 1

  [galaxy.disk.arms]
  contrast = 2.25

  # 1.5 reproduces the owner-approved target; the cook divides the texture's mean out of the glow.
  [galaxy.disk.gas]
  glow = 1.5
  # The nebula layer (docs/images/2026-10-15-nebula-target.png): neighbouring clouds take different hues,
  # and a second band of gas at giant-cloud scale fills the arms. large_glow is about 1.5 times the
  # field's mean (1.006899 at seed 1, so 1.5103), rounded to 1.51; the cook divides the mean out.
  palette            = [[1.0, 0.18, 0.32], [0.25, 1.0, 0.85], [1.0, 0.70, 0.22], [0.62, 0.30, 1.0]]
  palette_wavelength = 1500.0
  large_glow         = 1.51
  large_wavelength   = 100.0

  [galaxy.dust]
  reflection = 2.0
  bubble   = { center = [8200.0, 0.0, 20.0], radius = 300.0, height = 800.0, rim = 4.0 }
  contrast = 6.0
  filament = 3.5

[[galaxy]]
preset   = "small-spiral"
position = [780000.0, 120000.0, -40000.0]
rotation = [77.0, 0.0, 35.0]
seed     = 2
